spring.application.name=demo
logging.level.org.springframework.security=DEBUG

# Ensure we're running Spring MVC (servlet) even though WebFlux is on the classpath.
spring.main.web-application-type=servlet

# Default DB for local dev/tests: H2 (in-memory)
spring.datasource.url=jdbc:h2:mem:calendarBack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
